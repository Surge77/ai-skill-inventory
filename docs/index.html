<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skill Atlas</title>
<style>
  :root {
    --bg: #fbfaf8; --panel: #ffffff; --ink: #16130f; --soft: #6b6459;
    --line: #e4ded4; --accent: #b4451f; --accent-soft: #f6e9e2;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131110; --panel: #1c1917; --ink: #f2ece4; --soft: #a09689;
      --line: #2e2a26; --accent: #ff7a4d; --accent-soft: #35211a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #131110; --panel: #1c1917; --ink: #f2ece4; --soft: #a09689;
    --line: #2e2a26; --accent: #ff7a4d; --accent-soft: #35211a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; }
  header { padding: 28px 24px 16px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: -0.02em; }
  .sub { color: var(--soft); font-size: 13px; }
  .wrap { max-width: 1200px; margin: 0 auto; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  .stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--soft); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
  .controls { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 24px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=search], select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  input[type=search] { flex: 1 1 260px; min-width: 200px; }
  .count { color: var(--soft); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }
  main { padding: 0 24px 60px; }
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); margin-top: 16px; }
  table { border-collapse: collapse; width: 100%; min-width: 760px; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { position: sticky; top: 0; background: var(--panel); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--soft); cursor: pointer; white-space: nowrap; }
  th:hover { color: var(--accent); }
  tr:last-child td { border-bottom: 0; }
  td.name { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }
  td.desc { color: var(--soft); max-width: 620px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--soft); white-space: nowrap; }
  .tag.cat { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .off { opacity: 0.55; }
  footer { color: var(--soft); font-size: 12px; padding: 0 24px 40px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Skill Atlas</h1>
  <div class="sub" id="sub">loading…</div>
  <div class="stats" id="stats"></div>
</div></header>

<div class="controls"><div class="wrap" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;width:100%">
  <input type="search" id="q" placeholder="Search name, description, pack…" autocomplete="off">
  <select id="cat"><option value="">All categories</option></select>
  <select id="tool"><option value="">All tools</option></select>
  <select id="status">
    <option value="">Installed and not</option>
    <option value="1">Installed only</option>
    <option value="0">Not installed</option>
  </select>
  <span class="count" id="count"></span>
</div></div>

<main><div class="wrap">
  <div class="tablewrap"><table>
    <thead><tr>
      <th data-k="name">Skill</th>
      <th data-k="category">Category</th>
      <th data-k="description">What it does</th>
      <th data-k="family">Pack</th>
      <th data-k="copies" class="num">Copies</th>
      <th data-k="skillTokens" class="num">Tokens</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</div></main>

<footer><div class="wrap">
  Generated by <code>tools/scan.mjs</code>. Rows shown greyed are present on disk but not installed.
</div></footer>

<script>
let ALL = [], sortKey = "name", sortDir = 1;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

fetch("skills.json").then((r) => r.json()).then((d) => {
  ALL = d.skills;
  $("sub").textContent = `${d.count.toLocaleString()} unique skills · scanned ${d.generatedAt.slice(0, 10)}`;
  const installed = ALL.filter((s) => s.installed).length;
  const tokens = ALL.filter((s) => s.installed).reduce((a, s) => a + s.descTokens, 0);
  const stats = [
    [d.count.toLocaleString(), "unique skills"],
    [installed.toLocaleString(), "installed"],
    [(d.count - installed).toLocaleString(), "not installed"],
    [new Set(ALL.flatMap((s) => s.tools)).size, "tools"],
    [new Set(ALL.map((s) => s.category)).size, "categories"],
    ["~" + tokens.toLocaleString(), "standing tokens"],
  ];
  $("stats").innerHTML = stats.map(([b, s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");
  fill("cat", [...new Set(ALL.map((s) => s.category))].sort());
  fill("tool", [...new Set(ALL.flatMap((s) => s.tools))].sort());
  render();
});

function fill(id, vals) {
  const el = $(id);
  for (const v of vals) {
    const o = document.createElement("option");
    o.value = o.textContent = v;
    el.append(o);
  }
}

function render() {
  const q = $("q").value.trim().toLowerCase();
  const cat = $("cat").value, tool = $("tool").value, st = $("status").value;
  let rows = ALL.filter((s) => {
    if (cat && s.category !== cat) return false;
    if (tool && !s.tools.includes(tool)) return false;
    if (st === "1" && !s.installed) return false;
    if (st === "0" && s.installed) return false;
    if (!q) return true;
    return (s.name + " " + s.description + " " + s.family + " " + s.category).toLowerCase().includes(q);
  });
  rows.sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    const r = typeof x === "number" ? x - y : String(x).localeCompare(String(y));
    return r * sortDir;
  });
  $("count").textContent = `${rows.length.toLocaleString()} shown`;
  $("rows").innerHTML = rows.slice(0, 1500).map((s) => `
    <tr class="${s.installed ? "" : "off"}">
      <td class="name">${esc(s.name)}</td>
      <td><span class="tag cat">${esc(s.category)}</span></td>
      <td class="desc">${esc((s.description || "—").slice(0, 240))}</td>
      <td><span class="tag">${esc(s.family)}</span></td>
      <td class="num">${s.copies}</td>
      <td class="num">${s.skillTokens.toLocaleString()}</td>
    </tr>`).join("");
}

for (const id of ["q", "cat", "tool", "status"]) $(id).addEventListener("input", render);
document.querySelectorAll("th").forEach((th) =>
  th.addEventListener("click", () => {
    const k = th.dataset.k;
    sortDir = sortKey === k ? -sortDir : 1;
    sortKey = k;
    render();
  })
);
</script>
</body>
</html>
